# GLM-5.3-Flash (orcarouter NVFP4, BF16 dense weights, DFlash2 auto, vision).
# Sized for one RTX PRO 6000 Blackwell (96 GB) within 95% VRAM at 4 x 262,144 INT8 KV
# (docs/maintainer/glm5_3-flash-design.md).

model = "~/models/infernix/GLM-5.3-Flash-Uncensored-NVFP4-Infernix.infernix"
kv-dtype = "int8"
spec = "dflash2"
draft-model = "~/models/infernix/GLM-5.3-Flash-DFlash2-Infernix.infernix"
draft-tokens = "auto"
vision = true

[serve]
served-model-name = ["glm-5.3-flash"]
max-context = 262144
max-concurrency = 4
host-context-mib = 2048
experts = "vram=40%,ram=60%"
tolerant-tool-calls = true
host = "0.0.0.0"
port = 8000
